[project]
name = "a2a-lite"
version = "0.3.5"
description = "Simplified wrapper for Google's A2A Protocol SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "A2A Lite Contributors", email = "hello@a2a-lite.dev" }
]
keywords = ["a2a", "agents", "protocol", "sdk", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "a2a-sdk[http-server]>=0.2.6",
    "pydantic>=2.0",
    "typer>=0.9.0",
    "rich>=13.0",
    "uvicorn>=0.30.0",
    "httpx>=0.25.0",
    "starlette>=0.40.0",
]

[project.urls]
Homepage = "https://github.com/xvierd/a2a-lite"
Repository = "https://github.com/xvierd/a2a-lite"
Documentation = "https://github.com/xvierd/a2a-lite/tree/main/packages/python"
"Bug Tracker" = "https://github.com/xvierd/a2a-lite/issues"
Changelog = "https://github.com/xvierd/a2a-lite/blob/main/ROADMAP.md"

[project.optional-dependencies]
oauth = [
    "pyjwt[crypto]>=2.0",
]
mcp = [
    "mcp>=1.0",
]
openai = [
    "openai>=1.0",
]
anthropic = [
    "anthropic>=0.30",
]
bedrock = [
    "boto3>=1.35.0",
]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "httpx>=0.25",
    "ruff>=0.1.0",
]

[project.scripts]
a2a-lite = "a2a_lite.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_lite"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501", "B008", "B904", "B905", "UP007"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811", "F841", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = false
warn_unused_ignores = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["a2a_lite"]
branch = true
omit = [
    "*/llm.py",
    "*/router.py",
    "*/cli.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
    "pass",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
]
