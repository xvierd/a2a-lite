plugins {
    id 'java'
    id 'application'
}

group = 'com.example'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    // A2A Lite library - will be substituted from composite build
    implementation 'io.github.xvierd:a2a-lite:1.0.0'
    
    // Javalin for standalone mode
    implementation 'io.javalin:javalin:5.6.3'
    
    // Logging
    implementation 'org.slf4j:slf4j-simple:2.0.9'
}

application {
    mainClass = 'com.example.hello.HelloAgent'
}
