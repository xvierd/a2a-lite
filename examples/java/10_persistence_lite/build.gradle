plugins {
    id 'java'
    id 'application'
}

group = 'com.example'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    // A2A Lite library — publish locally first: cd ../../../packages/java && ./gradlew publishToMavenLocal
    implementation 'io.github.xvierd:a2a-lite:0.3.0'

    // Javalin for the standalone HTTP server
    implementation 'io.javalin:javalin:5.6.3'

    // Logging
    implementation 'org.slf4j:slf4j-simple:2.0.9'
}

application {
    mainClass = 'com.example.persistence.PersistenceLiteAgent'
}
