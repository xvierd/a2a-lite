name: Publish Python to PyPI

on:
  push:
    tags:
      - 'python/v*'   # python-only release: python/v0.3.0
      - 'v*'          # full release: v0.3.0 (all packages)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build only, no publish)'
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Verify release tag matches package version
        if: github.ref_type == 'tag'
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          case "$GITHUB_REF_NAME" in
            "v$version"|"python/v$version") ;;
            *) echo "::error::Release tag does not match Python package version $version"; exit 1 ;;
          esac

      - name: Store distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: packages/python/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    environment:
      name: pypi
      url: https://pypi.org/project/a2a-lite/
    permissions:
      id-token: write  # Required for OIDC trusted publisher

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
