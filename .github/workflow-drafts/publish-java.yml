name: Publish Java to Maven Central

on:
  push:
    tags:
      - 'java/v*'     # java-only release: java/v0.3.0
      - 'v*'          # full release: v0.3.0 (all packages)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build artifacts without signing or publishing)'
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-publish:
    name: Build and publish to Maven Central
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/java

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate publishing credentials
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          missing=0
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD GPG_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: ${name}. See .github/RELEASING.md."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          if [[ "$GPG_PRIVATE_KEY" != *"-----BEGIN PGP PRIVATE KEY BLOCK-----"* ]] ||
             [[ "$GPG_PRIVATE_KEY" != *"-----END PGP PRIVATE KEY BLOCK-----"* ]]; then
            echo "::error::GPG_PRIVATE_KEY must contain the complete ASCII-armored private key with real newlines."
            exit 1
          fi
          if ! printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --show-keys >/dev/null 2>&1; then
            echo "::error::GPG_PRIVATE_KEY is not a parseable armored key. Check its format and newlines in repository secrets."
            exit 1
          fi

      - name: Test and build publication artifacts
        run: ./gradlew test compileExamples jar sourcesJar javadocJar generatePomFileForMavenPublication --no-daemon

      - name: Verify release tag matches package version
        if: github.ref_type == 'tag'
        run: |
          version=$(./gradlew properties --quiet --no-daemon | sed -n 's/^version: //p')
          case "$GITHUB_REF_NAME" in
            "v$version"|"java/v$version") ;;
            *) echo "::error::Release tag does not match Java package version $version"; exit 1 ;;
          esac

      - name: Store publication artifacts
        uses: actions/upload-artifact@v4
        with:
          name: java-dist
          path: |
            packages/java/build/libs/*.jar
            packages/java/build/publications/maven/pom-default.xml

      - name: Publish to Maven Central
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: |
          # An absent optional key ID must be unset, not an empty Gradle property.
          if [ -z "$ORG_GRADLE_PROJECT_signingInMemoryKeyId" ]; then
            unset ORG_GRADLE_PROJECT_signingInMemoryKeyId
          fi
          ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
